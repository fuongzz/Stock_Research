[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnstock-research-platform"
version = "0.1.0"
description = "Reproducible research platform for Vietnamese stock behavioral fingerprints"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hdbscan = ["hdbscan>=0.8"]

[project.scripts]
vnstock-research = "vnstock_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

